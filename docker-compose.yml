# Full stack local testing: backend + storefronts (detal + mayor)
# Requisitos: backend/.env y frontend/.env (copiar desde .env.example)
# Usage: docker compose up --build
services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend-detal:
    build:
      context: ./frontend
      args:
        VITE_CATALOG_MODE: detal
    ports:
      - "3001:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend-mayor:
    build:
      context: ./frontend
      args:
        VITE_CATALOG_MODE: mayor
    ports:
      - "3002:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
