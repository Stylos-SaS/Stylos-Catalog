# Full stack local testing: backend + storefront (detal)
# Usage: docker compose up --build
services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
    restart: unless-stopped

  frontend-detal:
    build:
      context: ./frontend
      args:
        VITE_CATALOG_MODE: detal
        VITE_API_BASE_URL: http://localhost:4000
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-573001234567}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped
