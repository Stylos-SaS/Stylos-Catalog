services:
  frontend-detal:
    build:
      context: .
      args:
        VITE_CATALOG_MODE: detal
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-573001234567}
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    restart: unless-stopped

  frontend-mayor:
    build:
      context: .
      args:
        VITE_CATALOG_MODE: mayor
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-573001234567}
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
